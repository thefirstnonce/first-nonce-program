[package]
name = "first-nonce"
version = "0.1.0"
description = "The First Nonce: a launchpad where a coin's opening supply is mined with proof-of-work, then opens on a Meteora DAMM v2 pool"
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "first_nonce"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0" }
solana-keccak-hasher = "3.1.0"

[dev-dependencies]
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
