name: verifiable-build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install solana-verify
        run: cargo install solana-verify --locked
      - name: Reproducible build (docker)
        run: solana-verify build --library-name first_nonce --base-image solanafoundation/solana-verifiable-build@sha256:2e0b78f44ee76612e9260c7c988570c5e14de6fbd93e0ab07115ec7054473b4f
      - name: Executable hash
        run: solana-verify get-executable-hash target/deploy/first_nonce.so | tee executable-hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: first_nonce-verifiable
          path: |
            target/deploy/first_nonce.so
            executable-hash.txt
